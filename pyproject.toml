[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-food-concierge"
version = "1.0.0"
description = "AI Food Concierge — conversational Swiggy ordering agent with Streamlit UI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "google-genai>=0.1.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "requests>=2.32.0",
    "streamlit>=1.40.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
concierge-web  = "app:main"
concierge-cli  = "scripts.main:main"
concierge-demo = "scripts.demo:run"
concierge-auth = "scripts.auth:run"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
